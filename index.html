<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网站账号管理器 - Chrome 扩展</title>
    <link rel="icon" href="/icons/icon16.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* 全局滚动条样式 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
    <!-- 引入 Element Plus 的样式 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-plus/dist/index.css"
    />
  </head>
  <body>
    <!-- Vue 应用的挂载点 -->
    <div id="app"></div>
    <!-- 引入打包后的 JS 文件 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
